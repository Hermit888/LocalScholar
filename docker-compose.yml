# LocalScholar 基础设施（CPU 默认）
# 启动:  docker compose up -d
# GPU:   docker compose -f docker-compose.yml -f docker-compose.gpu.yml up -d
# 停止:  docker compose down        (加 -v 会删数据卷，慎用)

services:
  ollama:
    image: ollama/ollama:latest
    container_name: ls-ollama
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama_models:/root/.ollama      # 模型权重放数据卷里，不要每次重拉
    environment:
      - OLLAMA_KEEP_ALIVE=${OLLAMA_KEEP_ALIVE:-10m}
      - OLLAMA_NUM_PARALLEL=1            # 单用户本地系统，串行即可
      - OLLAMA_MAX_LOADED_MODELS=1       # 内存/显存有限，同时只留一个模型
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:latest
    container_name: ls-qdrant
    ports:
      - "${QDRANT_PORT:-6333}:6333"
      - "${QDRANT_GRPC_PORT:-6334}:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  postgres:
    image: postgres:16
    container_name: ls-postgres
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-scholar}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-scholar}
      - POSTGRES_DB=${POSTGRES_DB:-localscholar}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-scholar} -d ${POSTGRES_DB:-localscholar}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # api 服务等队友的 FastAPI 有 Dockerfile 后再接进来：
  # api:
  #   build: ./services/api
  #   ports: ["8000:8000"]
  #   environment:
  #     - OLLAMA_HOST=http://ollama:11434
  #     - QDRANT_URL=http://qdrant:6333
  #     - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
  #   depends_on:
  #     postgres: { condition: service_healthy }
  #     qdrant: { condition: service_started }
  #     ollama: { condition: service_started }

volumes:
  ollama_models:
  qdrant_data:
  pg_data:
